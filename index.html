<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股持仓助手 V2</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #182033;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Microsoft YaHei", Arial, sans-serif;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 16px 14px 50px;
    }

    .header {
      margin: 8px 2px 18px;
    }

    .title {
      font-size: 27px;
      font-weight: 800;
    }

    .sub {
      margin-top: 5px;
      color: #8a93a3;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px rgba(30,40,70,.05);
    }

    .card-title {
      font-size: 19px;
      font-weight: 750;
      margin-bottom: 14px;
    }

    .overview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .metric {
      background: #f5f7fb;
      padding: 13px 6px;
      text-align: center;
      border-radius: 13px;
    }

    .metric span {
      display: block;
      color: #929aaa;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric b {
      font-size: 16px;
    }

    .stock {
      padding: 14px 0;
      border-bottom: 1px solid #edf0f3;
    }

    .stock:last-child {
      border-bottom: 0;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name {
      font-weight: 750;
      font-size: 17px;
    }

    .code {
      color: #a0a6b2;
      font-size: 12px;
      margin-left: 5px;
    }

    .tag {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .green {
      color: #17834a;
      background: #e9f8ef;
    }

    .yellow {
      color: #9d7000;
      background: #fff5d7;
    }

    .orange {
      color: #c45c16;
      background: #fff0e5;
    }

    .red {
      color: #d43a3a;
      background: #ffeaea;
    }

    .info {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      font-size: 13px;
      color: #8a92a2;
    }

    .info b {
      display: block;
      margin-top: 4px;
      color: #283148;
      font-size: 15px;
    }

    .tip {
      background: #fff8e9;
      border-radius: 14px;
      padding: 14px;
      line-height: 1.7;
      font-size: 14px;
    }

    .upload-box {
      border: 2px dashed #dbe1ea;
      border-radius: 15px;
      padding: 22px 12px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      background: #2469df;
      color: white;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .secondary {
      background: #edf3ff;
      color: #2469df;
    }

    #preview {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }

    .date {
      color: #9299a8;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }

    .footer {
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
      line-height: 1.7;
      margin: 20px 8px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">📊 A股持仓助手 V2</div>
    <div class="sub">简单持仓 · 风险观察 · 每日复盘</div>
  </div>


  <div class="card">
    <div class="card-title">💰 账户概览</div>

    <div class="overview">
      <div class="metric">
        <span>持仓数量</span>
        <b>6只</b>
      </div>

      <div class="metric">
        <span>当前仓位</span>
        <b>偏高</b>
      </div>

      <div class="metric">
        <span>风险状态</span>
        <b>需控制</b>
      </div>
    </div>
  </div>


  <div class="card">
    <div class="card-title">💼 我的持仓</div>

    <div id="stocks"></div>
  </div>


  <div class="card">
    <div class="card-title">🧠 今日持仓思路</div>

    <div class="tip">
      当前组合先以控制风险为主。<br><br>

      🟢 强势股票优先保留。<br>
      🟡 震荡股票继续观察。<br>
      🟠 弱势股票注意反弹处理机会。<br>
      🔴 明显弱势股票重点控制风险。<br><br>

      不建议在整体仓位较高时连续补仓。
    </div>
  </div>


  <div class="card">
    <div class="card-title">📷 上传同花顺持仓截图</div>

    <div class="upload-box">

      <div>
        每天收盘后，把同花顺持仓页面截图上传到这里保存。
      </div>

      <label class="button" for="fileInput">
        选择持仓截图
      </label>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        onchange="previewImage(event)"
      >

      <img id="preview">

    </div>

    <button class="button secondary" onclick="showHelp()">
      🤖 怎么让我分析今天的持仓？
    </button>

    <div class="date" id="dateText"></div>
  </div>


  <div class="footer">
    V2 简洁版<br>
    当前页面用于持仓记录和辅助复盘。<br>
    真正的每日分析请把同花顺最新持仓截图发给 ChatGPT。
  </div>

</div>


<script>

const holdings = [

  {
    name: "圣泉集团",
    code: "605589",
    cost: 40.65,
    price: 38.64,
    tag: "重点观察",
    level: "orange"
  },

  {
    name: "联合精密",
    code: "001268",
    cost: 26.012,
    price: 26.37,
    tag: "持有观察",
    level: "green"
  },

  {
    name: "深科技",
    code: "000021",
    cost: 37.705,
    price: 36.54,
    tag: "观察",
    level: "yellow"
  },

  {
    name: "宏桥控股",
    code: "01378.HK",
    cost: 18.421,
    price: 18.71,
    tag: "偏强",
    level: "green"
  },

  {
    name: "晶华新材",
    code: "603683",
    cost: 17.23,
    price: 17.36,
    tag: "持有",
    level: "green"
  },

  {
    name: "生益科技",
    code: "600183",
    cost: 153.932,
    price: 144.30,
    tag: "重点防守",
    level: "red"
  }

];


function renderStocks() {

  const box = document.getElementById("stocks");

  box.innerHTML = holdings.map(stock => {

    const change =
      ((stock.price - stock.cost) / stock.cost) * 100;

    const changeText =
      (change >= 0 ? "+" : "") +
      change.toFixed(2) +
      "%";

    return `

      <div class="stock">

        <div class="top">

          <div>
            <span class="name">
              ${stock.name}
            </span>

            <span class="code">
              ${stock.code}
            </span>
          </div>

          <span class="tag ${stock.level}">
            ${stock.tag}
          </span>

        </div>


        <div class="info">

          <div>
            成本
            <b>${stock.cost}</b>
          </div>

          <div>
            参考价
            <b>${stock.price}</b>
          </div>

          <div>
            浮动
            <b>${changeText}</b>
          </div>

        </div>

      </div>

    `;

  }).join("");

}


function previewImage(event) {

  const file = event.target.files[0];

  if (!file) return;

  const img = document.getElementById("preview");

  img.src = URL.createObjectURL(file);

  img.style.display = "block";

  localStorage.setItem(
    "lastUpload",
    new Date().toLocaleString()
  );

  updateDate();
}


function updateDate() {

  const saved =
    localStorage.getItem("lastUpload");

  document.getElementById("dateText").innerText =
    saved
    ? "最近上传：" + saved
    : "今天还没有上传持仓截图";
}


function showHelp() {

  alert(
    "每天收盘后：\n\n" +
    "1. 打开同花顺持仓页面\n" +
    "2. 截图\n" +
    "3. 直接把截图发给 ChatGPT\n" +
    "4. 我会分析持仓盈亏、强弱、风险和第二天重点观察内容"
  );

}


renderStocks();
updateDate();

</script>

</body>
</html>
